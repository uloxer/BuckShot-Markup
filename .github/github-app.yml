instructions: |
  BuckShot is a Windows desktop application targeting .NET Framework 4.8. Build it on Windows with MSBuild from Visual Studio or Build Tools.
  Do not use `dotnet build`; the solution relies on MSBuild tasks that it does not support.
  Use the "Start BuckShot (Debug)" script to build and launch the application.
  BuckShot is produced at `src\BuckShot\bin\Debug\net480\BuckShot.exe`.
  This application has no local web server to start.

scripts:
  - name: Build BuckShot (Debug)
    command: msbuild src\BuckShot.sln /p:Configuration=Debug /restore /t:Build /v:minimal
  - name: Start BuckShot (Debug)
    command: msbuild src\BuckShot.sln /p:Configuration=Debug /restore /t:Build /v:minimal; if ($LASTEXITCODE -eq 0) { Start-Process -FilePath 'src\BuckShot\bin\Debug\net480\BuckShot.exe' }
