name: BuckShot Markup installer

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Product version (for example 0.9.666); blank uses the application version'
        required: false
        type: string
        default: ''
      build_msix:
        description: 'Also build and test the optional MSIX package'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build full application and installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./installer/build-greenshotplus.ps1 -PlatformToolset v143 -ReleaseVersion $env:RELEASE_VERSION
      - name: Check current-user installation and uninstall
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./installer/test-user-install.ps1 -InstallerPath ./installer/BuckShot-Markup-Setup.exe -ExpectedVersion $env:RELEASE_VERSION
      - name: Build signed development MSIX
        if: ${{ inputs.build_msix }}
        shell: powershell
        run: ./installer/build-msix.ps1 -CreateDevelopmentCertificate
      - name: Check current-user MSIX activation and uninstall
        if: ${{ inputs.build_msix }}
        shell: powershell
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./installer/test-msix-install.ps1 -ExpectedVersion $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: BuckShot-Markup-Windows-Installer
          path: |
            installer/BuckShot-Markup-Setup.exe
            installer/BuckShot-Markup-Setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_msix }}
        with:
          name: BuckShot-Markup-MSIX
          path: |
            installer/BuckShot-Markup.msix
            installer/BuckShot-Markup.msix.sha256
            installer/BuckShot-Markup-Development.cer
            installer/BuckShot-Markup-Development.cer.sha256
            installer/MSIX-INSTALL.md
          if-no-files-found: error
      - name: Upload editor QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuckShot-Editor-QA
          path: |
            TestResults/stage1-colourbar/*.png
            TestResults/stage1-colourbar/*.txt
            TestResults/stage2-render/*.png
            TestResults/stage2-render/*.txt
            TestResults/line-rotation/*.png
            TestResults/line-rotation/*.txt
            src/Greenshot.Tests/TestResults/*.trx
          if-no-files-found: warn
